<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#758ca1" />
    <title>Elliot's Cars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Drive the black Volvo in a garage courtyard"></canvas>
      <header class="topbar">
        <div class="top-actions"><button id="fullscreen-toggle" class="fullscreen-toggle" type="button" aria-label="Enter full screen" aria-pressed="false" title="Enter full screen"><svg class="enter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></svg><svg class="exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg><span class="fullscreen-label">Full screen</span></button><button id="camera-toggle" class="sound-toggle" type="button" aria-label="Camera: from above" title="Camera: from above">🛰️</button><button id="map-toggle" class="sound-toggle" type="button" aria-label="Open world" title="Open world">🗺️</button><button id="vehicle-toggle" class="sound-toggle" type="button" aria-label="Drive the bobby car">🧒</button><button id="sound-toggle" class="sound-toggle" type="button" aria-label="Mute sounds" aria-pressed="false">🔊</button></div>
      </header>
      <button id="menu-button" class="menu-button" type="button" aria-label="Open menu"><span aria-hidden="true">🏠</span></button>
      <div id="menu" class="menu" hidden>
        <div class="menu-card" role="dialog" aria-modal="true" aria-label="Menu">
          <button class="menu-close" data-action="play" type="button" aria-label="Close menu">✕</button>
          <div class="menu-panel" id="menu-main">
            <h1 class="menu-title">Elliot's Cars</h1>
            <button class="drive-big" data-action="play" type="button"><span class="drive-big-icon" aria-hidden="true">▶</span>Drive</button>
            <div class="place-row">
              <button class="place-tile place-levels" data-action="levels" type="button"><span class="tile-icon" aria-hidden="true">🏁</span><span class="tile-label">Levels</span></button>
              <button class="place-tile place-town" data-action="world" type="button"><span class="tile-icon" aria-hidden="true">🏙️</span><span class="tile-label">Town</span></button>
            </div>
            <div class="choice-group">
              <h2 class="choice-title">Who drives?</h2>
              <div class="choice-row">
                <button class="choice" data-vehicle="volvo" type="button" aria-label="Car"><span class="tile-icon" aria-hidden="true">🚙</span><span class="choice-label">Car</span></button>
                <button class="choice" data-vehicle="bobby" type="button" aria-label="Bobby car"><span class="tile-icon" aria-hidden="true">🧒</span><span class="choice-label">Bobby car</span></button>
              </div>
            </div>
            <div class="choice-group">
              <h2 class="choice-title">Camera</h2>
              <div class="choice-row">
                <button class="choice" data-camera="top" type="button" aria-label="Camera from above"><span class="tile-icon" aria-hidden="true">🛰️</span><span class="choice-label">Above</span></button>
                <button class="choice" data-camera="chase" type="button" aria-label="Camera behind"><span class="tile-icon" aria-hidden="true">🎥</span><span class="choice-label">Behind</span></button>
                <button class="choice" data-camera="near" type="button" aria-label="Camera close up"><span class="tile-icon" aria-hidden="true">👀</span><span class="choice-label">Close</span></button>
              </div>
            </div>
            <div class="choice-group">
              <h2 class="choice-title">Speed</h2>
              <label class="speed-control">
                <span class="speed-end" aria-hidden="true">🐢</span>
                <input id="speed-slider" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="Max speed" />
                <span class="speed-end" aria-hidden="true">🐇</span>
              </label>
            </div>
            <div class="small-row">
              <button class="round-button" data-action="sound" type="button" aria-label="Sound on or off"><span id="menu-sound-icon" aria-hidden="true">🔊</span></button>
              <button class="round-button" data-action="fullscreen" type="button" aria-label="Big screen"><span aria-hidden="true">⛶</span></button>
            </div>
          </div>
          <div class="menu-panel" id="menu-levels" hidden>
            <div class="levels-top">
              <button class="round-button" data-action="back" type="button" aria-label="Back"><span aria-hidden="true">⬅</span></button>
              <h1 class="menu-title">Levels</h1>
            </div>
            <div class="level-grid" id="level-grid"></div>
          </div>
        </div>
      </div>
      <div class="level-badge" id="level-badge" aria-live="polite">Level 1</div>
      <div id="loading" class="loading"><span class="spinner"></span> Getting your car ready...</div>
      <div class="crash-feedback" id="crash-feedback" role="status" aria-live="assertive" hidden><div class="crash-message"><span aria-hidden="true">✦</span><strong>Oops!</strong><small>Trying again...</small></div></div>
      <div class="win-screen" id="win-screen" hidden>
        <div class="win-card" role="dialog" aria-labelledby="win-title" aria-modal="true">
          <div class="win-stars" id="win-stars" aria-label="Three stars"></div>
          <h1 id="win-title">Great driving!</h1>
          <p id="win-level">Level 1 complete</p>
          <p class="win-time" id="win-time">Time: 0:00</p>
          <div class="win-actions">
            <button id="next-level" type="button">Next level <span aria-hidden="true">➜</span></button>
            <button id="retry-level" type="button">Retry level <span aria-hidden="true">↻</span></button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
