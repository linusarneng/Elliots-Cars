<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#758ca1" />
    <title>Volvo V70 Garage Drive</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Drive the black Volvo in a garage courtyard"></canvas>
      <header class="topbar">
        <div class="top-actions"><button id="fullscreen-toggle" class="fullscreen-toggle" type="button" aria-label="Enter full screen" aria-pressed="false" title="Enter full screen"><svg class="enter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></svg><svg class="exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg><span class="fullscreen-label">Full screen</span></button><button id="map-toggle" class="sound-toggle" type="button" aria-label="Open world" title="Open world">🗺️</button><button id="vehicle-toggle" class="sound-toggle" type="button" aria-label="Drive the bobby car">🧒</button><button id="sound-toggle" class="sound-toggle" type="button" aria-label="Mute sounds" aria-pressed="false">🔊</button></div>
      </header>
      <div class="level-badge" id="level-badge" aria-live="polite">Level 1</div>
      <div id="loading" class="loading"><span class="spinner"></span> Getting your car ready...</div>
      <div class="crash-feedback" id="crash-feedback" role="status" aria-live="assertive" hidden><div class="crash-message"><span aria-hidden="true">✦</span><strong>Oops!</strong><small>Trying again...</small></div></div>
      <div class="win-screen" id="win-screen" hidden>
        <div class="win-card" role="dialog" aria-labelledby="win-title" aria-modal="true">
          <div class="win-stars" id="win-stars" aria-label="Three stars"></div>
          <h1 id="win-title">Great driving!</h1>
          <p id="win-level">Level 1 complete</p>
          <p class="win-time" id="win-time">Time: 0:00</p>
          <div class="win-actions">
            <button id="next-level" type="button">Next level <span aria-hidden="true">➜</span></button>
            <button id="retry-level" type="button">Retry level <span aria-hidden="true">↻</span></button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
